# Fastener dimensions (mm). Nominal values from the ISO/DIN standards.
# Head: dk = head diameter, k = head height. Nut: af = across flats, m = thickness.
# Printed-hole sizes do NOT live here: they depend on material, see your tolerance profile.
#
# Adding a size: copy a block and fill every field. Adding a head type: add it
# under every thread you use. Source tags as in components (DRAWING = standard).

source: "ISO 4762, ISO 7380, ISO 7045, ISO 10642, DIN 84, DIN 934, DIN 125 nominal values"

threads:
  M2:
    d: 2.0
    pitch: 0.4
    heads:
      cheese:  {dk: 3.8, k: 1.3, driver_d: 5.0}     # DIN 84 slotted cheese head
      socket:  {dk: 3.8, k: 2.0, driver_d: 5.0}     # ISO 4762
      button:  {dk: 3.5, k: 1.1, driver_d: 5.0}     # ISO 7380
      pan:     {dk: 4.0, k: 1.6, driver_d: 5.0}     # ISO 7045
      flat:    {dk: 3.8, k: 1.2, driver_d: 5.0, countersunk: 90}   # ISO 10642
    nut:    {af: 4.0, m: 1.6}
    washer: {od: 5.0, t: 0.3}
    insert: {hole_d: [3.1, 3.3], len: 3.0, source: "Ruthex-type M2x3 datasheet"}
  M3:
    d: 3.0
    pitch: 0.5
    heads:
      cheese:  {dk: 5.5, k: 2.0, driver_d: 6.0}
      socket:  {dk: 5.5, k: 3.0, driver_d: 6.0}
      button:  {dk: 5.7, k: 1.65, driver_d: 6.0}
      pan:     {dk: 5.6, k: 2.4, driver_d: 6.0}
      flat:    {dk: 6.72, k: 1.86, driver_d: 6.0, countersunk: 90}
    nut:    {af: 5.5, m: 2.4}
    washer: {od: 7.0, t: 0.5}
    insert: {hole_d: [3.9, 4.1], len: 5.7, source: "Ruthex-type M3x5.7 datasheet"}
  M4:
    d: 4.0
    pitch: 0.7
    heads:
      cheese:  {dk: 7.0, k: 2.6, driver_d: 8.0}
      socket:  {dk: 7.0, k: 4.0, driver_d: 8.0}
      button:  {dk: 7.6, k: 2.2, driver_d: 8.0}
      pan:     {dk: 8.0, k: 3.1, driver_d: 8.0}
      flat:    {dk: 8.96, k: 2.48, driver_d: 8.0, countersunk: 90}
    nut:    {af: 7.0, m: 3.2}
    washer: {od: 9.0, t: 0.8}
    insert: {hole_d: [5.5, 5.7], len: 8.1, source: "Ruthex-type M4x8.1 datasheet"}
  M5:
    d: 5.0
    pitch: 0.8
    heads:
      cheese:  {dk: 8.5, k: 3.3, driver_d: 9.0}
      socket:  {dk: 8.5, k: 5.0, driver_d: 9.0}
      button:  {dk: 9.5, k: 2.75, driver_d: 9.0}
      pan:     {dk: 9.5, k: 3.8, driver_d: 9.0}
      flat:    {dk: 11.2, k: 3.1, driver_d: 9.0, countersunk: 90}
    nut:    {af: 8.0, m: 4.0}
    washer: {od: 10.0, t: 1.0}
    insert: {hole_d: [6.3, 6.5], len: 9.5, source: "Ruthex-type M5x9.5 datasheet"}

# Fastener kinds a manifest can use:
#   self-tap : machine screw cuts its own thread in the LAST part of `joins`
#   insert   : heat-set insert in the LAST part of `joins`
#   nut      : nut on the far side; every part in `joins` gets a clearance hole
#   through  : passes through everything into something not modelled (wall, standoff)
#   standoff : screw into a bought threaded standoff/component (thread not printed)
